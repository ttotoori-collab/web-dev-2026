<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Border Styles</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }
    div {
      padding: 8px 12px;
      margin-bottom: 16px;
    }
    h1, h2, h3, h4, h5 {
      margin: 0;
    }
  </style>
</head>
<body>
  <div style="border: 1px solid;">
    <h1>1</h1>
  </div>
  <div style="border: 1px dashed;">
    <h2>2</h2>
  </div>
  <div style="border: 1px dotted;">
    <h3>3</h3>
  </div>
  <div style="border: 1px double;">
    <h4>4</h4>
  </div>
  <div style="border: 1px groove;">
    <h5>5</h5>
  </div>
</body>
</html>
