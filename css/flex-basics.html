<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flex Basics</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }

    /* CSS: 부모에게 flex 지시 */
    .container {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .container > div {
      padding: 16px 24px;
      border: 1px solid;
    }
  </style>
</head>
<body>
  <!-- HTML: 박스 3개를 감싸는 부모 -->
  <div class="container">
    <div>박스1</div>
    <div>박스2</div>
    <div>박스3</div>
  </div>
</body>
</html>
